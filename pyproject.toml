[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-quantum-sensing"
version = "0.1.0"
description = "Reproducible single-NV Ramsey control-attack experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2", "matplotlib>=3.7", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
pulse = ["qutip>=5,<6"]

[project.scripts]
aqs = "adversarial_quantum_sensing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

